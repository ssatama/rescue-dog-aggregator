name: Quick Check

permissions:
  contents: read

on:
  push:
    branches-ignore: [main, "dependabot/**"]

# Superseded pushes are cancelled. Once a PR exists, ci-pr.yml is the real
# gate and this only has to keep a bare branch from drifting.
concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # No Postgres service here, so PYTEST_UNIT_ONLY tells conftest to skip
      # pool initialisation. Without it the pool burns three connection
      # attempts with exponential backoff before a bare except swallows the
      # failure - seconds of waste on every push, and silent.
      - name: Run unit tests
        env:
          TESTING: "true"
          PYTEST_UNIT_ONLY: "true"
        run: uv run pytest -m "unit" --maxfail=3 -q

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: ./frontend
        run: pnpm tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Unit tests
        working-directory: ./frontend
        run: pnpm test --passWithNoTests --watchAll=false
