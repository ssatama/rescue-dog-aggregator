name: Quick Check

permissions:
  contents: read

on:
  push:
    branches-ignore: [main]

# Superseded pushes are cancelled. Once a PR exists, ci-pr.yml is the real
# gate and this only has to keep a bare branch from drifting.
concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # No Postgres service here, so PYTEST_UNIT_ONLY tells conftest to skip
      # pool initialisation. Without it the pool burns three connection
      # attempts with exponential backoff before a bare except swallows the
      # failure - seconds of waste on every push, and silent.
      - name: Run unit tests
        env:
          TESTING: "true"
          PYTEST_UNIT_ONLY: "true"
        run: uv run pytest -m "unit" --maxfail=3 -q

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: ./frontend
        run: pnpm tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Unit tests
        working-directory: ./frontend
        run: pnpm test --passWithNoTests --watchAll=false
